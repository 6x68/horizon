name: release
# Automatic game releases (docs/release-flow.md). Horizon ships only the Nightly since 2026-10-28 (Ludovic): this
# workflow is the batch train that decides when a new Nightly goes out, and `nightly build` (nightly-build.yml) builds,
# signs and publishes it. After every green `checks` run on main, every 10 minutes (so a batch waiting for merges to
# settle goes out without another merge) and by hand, tools/release_train.py decides, for a commit whose checks and
# parity-main (the vanilla harnesses on main) both passed: a Nightly when 5 pull requests merged since the published
# Nightly changed what players run and the newest merged 5 minutes ago, or when the oldest has waited 6 hours, or at
# once for a pull request labelled release-now. RELEASES_PAUSED=1 (repository variable) stops it; so does an open issue
# labelled release-blocker, forced runs too (nightly-build.yml checks again before publishing). One Nightly build at a
# time, at most 12 a day (release-now and force=true pass the cap). No `vX.Y.Z` game release is made any more.
#   gh workflow run release --ref <branch>                       # dry run: decides, starts nothing
#   gh workflow run release -f dry_run=false -f force=true       # on main: a Nightly now, whatever the rules say
on:
  workflow_run:
    # A game release ships a commit both passed on (parity-main runs on batches: the newest commit it passed on).
    workflows: [checks, parity-main]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '2-59/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide only; start no Nightly build
        type: boolean
        default: true
      force:
        description: A Nightly even without player-facing changes, before merges settle, while paused or past the day's cap
        type: boolean
        default: false

permissions:
  contents: read
  # The open release-blocker issues (decide).
  issues: read
  # The checks, parity-main and nightly build runs (decide).
  actions: read
concurrency:
  # One release at a time. A hand-started dry run publishes nothing, so it can't race a real release: it gets a
  # group of its own. In the shared group, a release queued behind it replaced it as the pending run and GitHub
  # cancelled it (#2779's dry run, 2026-10-27), which happens all day while releases go out in batches.
  group: game-release${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # starts `nightly build`
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          URGENT: ${{ inputs.force }}
        run: |
          gh workflow run nightly-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f base="$HEAD_SHA" -f urgent="$URGENT"
          echo "### Started \`nightly build\` on ${HEAD_SHA:0:9}" >> "$GITHUB_STEP_SUMMARY"
